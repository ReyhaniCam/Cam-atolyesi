<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cam Atölyesi — Kesim Paneli</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css">
<script src="lib/firebase-app.js"></script><script src="lib/firebase-auth.js"></script><script src="lib/firebase-database.js"></script>
<script src="lib/xlsx.full.min.js"></script><script src="firebase-config.js"></script>
</head><body>
<div class="app">
<header><div class="brand"><h1>Cam Atölyesi</h1><span>Çift cam sipariş &amp; kesim planı</span></div>
<div class="auth-status"><span class="admin-badge role-guest" id="sync">Bağlanıyor…</span></div></header>
<div class="nav-tabs">
<button class="tab-btn active" data-t="siparis">📝 Siparişler</button>
<button class="tab-btn" data-t="cam">🪟 Cam Kesim</button>
<button class="tab-btn" data-t="cita">📏 Çıta Kesim</button>
<button class="tab-btn" data-t="ayar">⚙️ Ayarlar</button></div>

<div id="tab-siparis" class="tab-content active"><div class="box">
<h3>Yeni sipariş</h3>
<div class="fr">
<label>Müşteri<input id="f-m" placeholder="Ad Soyad"></label>
<label>Apartman / Adres<input id="f-a" placeholder="Güneş Apt."></label></div>
<div class="fr">
<label>En (mm)<input id="f-w" type="number" inputmode="numeric"></label>
<label>Boy (mm)<input id="f-h" type="number" inputmode="numeric"></label>
<label>Adet<input id="f-q" type="number" inputmode="numeric" value="1"></label></div>
<div class="fr">
<label>Cam (mm)<select id="f-t"><option>4</option><option>5</option><option>6</option></select></label>
<label>Çıta (mm)<select id="f-c"><option>8</option><option>10</option><option>12</option><option selected>14</option><option>16</option><option>18</option><option>20</option></select></label></div>
<button class="btn btn-primary" id="add">➕ Siparişi ekle</button></div>
<div class="box"><div class="fr"><h3 style="margin:0">Sipariş listesi</h3>
<select id="flt"><option value="bekleyen">Bekleyenler</option><option value="hepsi">Hepsi</option></select></div>
<div class="tb"><table id="olist"></table></div></div></div>

<div id="tab-cam" class="tab-content"><div class="box fr"><button class="btn btn-primary" id="rc">🔄 Planı yenile</button>
<button class="btn btn-success" id="dc">✅ Bu planı kesildi işaretle</button>
<button class="btn" id="xc">📥 Excel</button><button class="btn" onclick="window.print()">🖨️ Yazdır</button></div><div id="o-cam"></div></div>

<div id="tab-cita" class="tab-content"><div class="box fr"><button class="btn btn-primary" id="rt">🔄 Planı yenile</button>
<button class="btn btn-success" id="dt">✅ Bu planı kesildi işaretle</button>
<button class="btn" id="xt">📥 Excel</button><button class="btn" onclick="window.print()">🖨️ Yazdır</button></div><div id="o-cita"></div></div>

<div id="tab-ayar" class="tab-content"><div class="box"><h3>Kesim ayarları</h3>
<label>Cam levha ölçüleri (en x boy, virgülle ayırın)<input id="s-sheets"></label>
<div class="fr"><label>Kesim payı (mm)<input id="s-kerf" type="number"></label>
<label>Çıta boyu (mm)<input id="s-bl" type="number"></label>
<label>Çıta ölçü düşümü (mm)<input id="s-ded" type="number"></label></div>
<p class="mu">Çıta çerçevesi = 2×(En−düşüm) + 2×(Boy−düşüm). Sistem, listedeki levha ölçülerinden en az fire bırakanı otomatik seçer.</p>
<button class="btn btn-primary" id="ssave">💾 Kaydet</button></div></div>
</div><div class="toast" id="toast"></div>
<script src="app.js"></script></body></html>
